version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      # Composite actions are not scanned via "/"; list them explicitly.
      - "/.github/actions/setup-env"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 99
    groups:
      github-action-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 99
    groups:
      workflows-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 99
    groups:
      uv-dependencies:
        patterns:
          - "*"
